<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OKResume is now ResuMoose!</title>
    <meta http-equiv="refresh" content="5;url=https://resumoose.com">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 60px 40px;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            max-width: 300px;
            height: auto;
            margin-bottom: 30px;
            animation: fadeIn 0.8s ease-out 0.3s both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        h1 {
            font-size: 2.5em;
            color: #333;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .highlight {
            color: #007bff;
        }

        p {
            font-size: 1.2em;
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .redirect-notice {
            background: #e7f3ff;
            border-left: 4px solid #007bff;
            padding: 15px 20px;
            margin: 30px 0;
            border-radius: 8px;
            font-size: 0.95em;
            color: #555;
        }

        .button {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 1.1em;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.4);
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 123, 255, 0.6);
        }

        .countdown {
            margin-top: 20px;
            font-size: 0.9em;
            color: #999;
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 30px;
            }

            h1 {
                font-size: 2em;
            }

            p {
                font-size: 1.1em;
            }

            .logo {
                max-width: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="images/resumoose_brand.png" alt="ResuMoose Logo" class="logo">
        
        <h1>We've <span class="highlight">Moved</span>!</h1>
        
        <p>
            <strong>OKResume.ai</strong> is now <strong class="highlight">ResuMoose.com</strong>
        </p>
        
        <p>
            Same great AI-powered resume builder, new name and home!
        </p>

        <div class="redirect-notice">
            <strong>📍 You're being redirected automatically...</strong><br>
            If you're not redirected in 5 seconds, click the button below.
        </div>

        <a href="https://resumoose.com" class="button">
            Go to ResuMoose.com
        </a>

        <div class="countdown" id="countdown">
            Redirecting in <span id="seconds">5</span> seconds...
        </div>
    </div>

    <script>
        let seconds = 5;
        const countdownElement = document.getElementById('seconds');
        
        const interval = setInterval(() => {
            seconds--;
            if (seconds > 0) {
                countdownElement.textContent = seconds;
            } else {
                clearInterval(interval);
                window.location.href = 'https://resumoose.com';
            }
        }, 1000);
    </script>
</body>
</html>
